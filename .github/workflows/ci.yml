name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        trino: [ "482", "483" ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify against SPI ${{ matrix.trino }}
      run: ./mvnw -B verify -Dtrino.version=${{ matrix.trino }}

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-report-${{ matrix.trino }}
        path: target/site/jacoco/

    - name: Upload SpotBugs report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: spotbugs-report-${{ matrix.trino }}
        path: target/spotbugsXml.xml

  acceptance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        trino: [ "482", "483" ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build plugin against floor (482)
      run: ./mvnw -B package -DskipTests -Dtrino.version=482

    - name: Run acceptance tests against Trino ${{ matrix.trino }}
      working-directory: docker
      env:
        TRINO_IMAGE: trinodb/trino:${{ matrix.trino }}
        BALEIA_TRINO_DB_PASSWORD: acceptance
      run: ./acceptance.sh
