name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        trino: [ "482", "483" ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify against SPI ${{ matrix.trino }}
      run: ./mvnw -B verify -Dtrino.version=${{ matrix.trino }}

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-report-${{ matrix.trino }}
        path: target/site/jacoco/

    - name: Upload SpotBugs report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: spotbugs-report-${{ matrix.trino }}
        path: target/spotbugsXml.xml

  acceptance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        trino: [ "482", "483" ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build plugin against floor (482)
      run: ./mvnw -B package -DskipTests -Dtrino.version=482

    - name: Start Docker stack
      working-directory: docker
      env:
        TRINO_IMAGE: trinodb/trino:${{ matrix.trino }}
        BALEIA_TRINO_DB_PASSWORD: acceptance
      run: |
        docker compose up -d
        docker compose exec -T postgres pg_isready -U baleia -d baleia

    - name: Run acceptance tests against Trino ${{ matrix.trino }}
      working-directory: docker
      env:
        TRINO_IMAGE: trinodb/trino:${{ matrix.trino }}
        BALEIA_TRINO_DB_PASSWORD: acceptance
      run: ./acceptance.sh

  javadoc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Convert README to Javadoc overview
      run: pandoc README.md --standalone --metadata title="Baleia Trino Catalog Store" -o target/overview.html

    - name: Generate Javadoc
      env:
        DATA_TRACKING: ${{ secrets.DATA_TRACKING }}
      run: ./mvnw -B process-resources javadoc:javadoc -Pjavadoc-overview -Dtrino.version=482

    - name: Deploy to gh-pages
      run: |
        cd target/reports/apidocs
        git init
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b gh-pages
        git add .
        git commit -m "docs: update Javadoc"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
