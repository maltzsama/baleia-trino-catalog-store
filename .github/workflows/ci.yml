name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        trino: [ "483", "484" ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify against SPI ${{ matrix.trino }}
      run: ./mvnw -B verify -Dtrino.version=${{ matrix.trino }}

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-report-${{ matrix.trino }}
        path: target/site/jacoco/

    - name: Upload SpotBugs report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: spotbugs-report-${{ matrix.trino }}
        path: target/spotbugsXml.xml

  # Baleia's OPA policy (opa/): strict check, formatting and the Rego tests,
  # which replay the OPA inputs recorded from Trino, with the OPA release the
  # Baleia chart pins. Also builds the policy bundle the release ships, twice,
  # to prove it is deterministic.
  opa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPA_VERSION: v1.22.4
      OPA_SHA256: 35e3b352e715e80624ead6c89930d8585f6f7d94cdc409eb2a9fe36620dcccba
    steps:
    - uses: actions/checkout@v7

    - name: Install OPA ${{ env.OPA_VERSION }}
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/opa" "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
        echo "${OPA_SHA256}  $RUNNER_TEMP/opa" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/opa"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Check, format and test the Rego
      run: |
        opa check --strict opa/baleia
        opa fmt --list --fail opa/baleia
        opa test -v opa/baleia

    - name: Build the policy bundle
      run: |
        set -euo pipefail
        first="$(opa/build-bundle.sh "$RUNNER_TEMP/first.tar.gz")"
        second="$(opa/build-bundle.sh "$RUNNER_TEMP/second.tar.gz")"
        test "$first" = "$second"
        cmp "$RUNNER_TEMP/first.tar.gz" "$RUNNER_TEMP/second.tar.gz"
        opa inspect "$RUNNER_TEMP/first.tar.gz"
        opa inspect --format json "$RUNNER_TEMP/first.tar.gz" | grep -q "\"revision\": *\"$first\""

  acceptance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        trino: [ "483", "484" ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build plugin against Trino ${{ matrix.trino }}
      run: ./mvnw -B package -DskipTests -Dtrino.version=${{ matrix.trino }}

    - name: Start Docker stack
      working-directory: docker
      env:
        TRINO_IMAGE: trinodb/trino:${{ matrix.trino }}
        BALEIA_TRINO_DB_PASSWORD: acceptance
      run: |
        docker compose up -d
        docker compose exec -T postgres pg_isready -U baleia -d baleia

    - name: Run acceptance tests against Trino ${{ matrix.trino }}
      working-directory: docker
      env:
        TRINO_IMAGE: trinodb/trino:${{ matrix.trino }}
        BALEIA_TRINO_DB_PASSWORD: acceptance
      run: ./acceptance.sh

  javadoc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One Pages deployment at a time. Merging several PRs in a row starts one
    # run per push, and their deployments raced: deploy-pages failed with
    # "Fetching artifact metadata failed" while another run was deploying. A
    # queued deployment waits instead of cancelling the one in flight; only the
    # newest pending one runs, so the site ends on the latest main.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Install pandoc
      run: sudo apt-get update && sudo apt-get install -y pandoc

    - name: Convert README to Javadoc overview
      run: mkdir -p target && pandoc README.md --standalone --metadata title="Baleia Trino Catalog Store" -o target/overview.html

    - name: Generate Javadoc
      env:
        DATA_TRACKING: ${{ secrets.DATA_TRACKING }}
      run: ./mvnw -B process-resources javadoc:javadoc -Pjavadoc-overview -Dtrino.version=483

    # The artifact is named per attempt: artifacts belong to the run, so a
    # re-run would otherwise upload a second "github-pages" and deploy-pages
    # refuses to pick between them ("Multiple artifacts named github-pages").
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: target/reports/apidocs
        name: github-pages-${{ github.run_attempt }}

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v5
      with:
        artifact_name: github-pages-${{ github.run_attempt }}
