name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v0.5.0)'
        required: true
      create_release:
        description: 'Create the release (and the tag) first if it does not exist, at `ref`; then publish and build the tarballs'
        type: boolean
        default: false
      ref:
        description: 'Commit or branch the new tag points at (only used with create_release)'
        default: 'main'
      tarballs_only:
        description: 'Only (re)build and upload the plugin tarballs to the existing release; do not republish the Maven package or the image'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
    - uses: googleapis/release-please-action@v5
      id: release
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  # Manual path: creates the release (and its tag) at `ref` when it does not exist,
  # so a release never depends on release-please succeeding at creating it. The
  # publish and tarballs jobs below then run for that tag.
  create-release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release && !inputs.tarballs_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create the release if it does not exist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
        TARGET: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "Release $TAG already exists; nothing to create."
          exit 0
        fi
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "$TAG" --generate-notes

  publish:
    needs: [release-please, create-release]
    if: |
      always() && needs.create-release.result != 'failure' && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && !inputs.tarballs_only)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        server-id: github
        server-username: MAVEN_USERNAME
        server-password: MAVEN_TOKEN

    - name: Publish to GitHub Packages
      run: ./mvnw -B deploy -DskipTests
      env:
        MAVEN_USERNAME: ${{ github.actor }}
        MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push the Trino + plugin image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: |
          ghcr.io/maltzsama/baleia-trino:${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          ghcr.io/maltzsama/baleia-trino:latest

  # Baleia installs the plugin from these tarballs (an init container downloads
  # baleia-catalog-store-<version>+trino<trino>.tar.gz and checks the .sha256, which
  # holds just the hash), so a release carries one per supported Trino version, each
  # built against that SPI. Keep the matrix in sync with ci.yml. It runs on every
  # release and can be re-run for an existing tag with workflow_dispatch
  # (tarballs_only) without republishing the Maven package or the image.
  tarballs:
    needs: [release-please, create-release]
    if: |
      always() && needs.create-release.result != 'failure' && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the tarball to the release
    strategy:
      fail-fast: false
      matrix:
        trino: [ "483" ]

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build the plugin against Trino ${{ matrix.trino }}
      run: ./mvnw -B clean package -DskipTests -Dtrino.version=${{ matrix.trino }}

    - name: Pack the tarball
      id: bundle
      env:
        TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        TRINO: ${{ matrix.trino }}
      run: |
        set -euo pipefail
        NAME="baleia-catalog-store-${TAG#v}+trino${TRINO}.tar.gz"
        tar -czf "$NAME" -C target baleia-catalog-store
        sha256sum "$NAME" | cut -d' ' -f1 > "$NAME.sha256"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Upload the tarball to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        NAME: ${{ steps.bundle.outputs.name }}
      run: gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
