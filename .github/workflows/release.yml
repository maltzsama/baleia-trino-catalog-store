name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v0.5.0)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
    - uses: googleapis/release-please-action@v5
      id: release
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release-please]
    if: |
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the plugin tarball to the release
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        server-id: github
        server-username: MAVEN_USERNAME
        server-password: MAVEN_TOKEN

    - name: Publish to GitHub Packages
      run: ./mvnw -B deploy -DskipTests
      env:
        MAVEN_USERNAME: ${{ github.actor }}
        MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Baleia installs the plugin from this tarball (an init container downloads it
    # and checks the .sha256, which holds just the hash). `deploy` above already ran
    # `package`, which leaves the plugin and its dependencies in
    # target/baleia-catalog-store.
    - name: Build the plugin tarball
      id: bundle
      env:
        TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      run: |
        set -euo pipefail
        VERSION="${TAG#v}"
        TRINO="$(./mvnw -q -B help:evaluate -Dexpression=trino.version -DforceStdout)"
        NAME="baleia-catalog-store-${VERSION}+trino${TRINO}.tar.gz"
        tar -czf "$NAME" -C target baleia-catalog-store
        sha256sum "$NAME" | cut -d' ' -f1 > "$NAME.sha256"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Upload the tarball to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        NAME: ${{ steps.bundle.outputs.name }}
      run: gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push the Trino + plugin image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: |
          ghcr.io/maltzsama/baleia-trino:${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          ghcr.io/maltzsama/baleia-trino:latest
