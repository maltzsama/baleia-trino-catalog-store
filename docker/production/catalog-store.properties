# Production catalog-store config. Every value that varies per deployment is
# an Airlift ${ENV:NAME} reference — resolved at boot, never baked into the
# image. See docker/trino/catalog-store.properties for the dev-only version
# with hardcoded values (used by docker-compose.yml, not this file).
baleia.jdbc-url=${ENV:BALEIA_JDBC_URL}
baleia.username=${ENV:BALEIA_TRINO_DB_USERNAME}
baleia.password=${ENV:BALEIA_TRINO_DB_PASSWORD}
baleia.cluster-name=${ENV:BALEIA_CLUSTER_NAME}
baleia.connect-timeout=10s
baleia.socket-timeout=30s
baleia.secret-file-base-dir=/etc/trino/secrets
