# Production config.properties. Airlift resolves ${ENV:NAME} natively at
# boot (confirmed against the base trinodb/trino image's own default, which
# already does this for catalog.management) — no entrypoint wrapper needed.
#
# coordinator / node-scheduler.include-coordinator: NOT upstream Trino env
# vars by themselves — TRINO_INCLUDE_COORDINATOR is a convention this image
# adopts so the SAME image can boot as coordinator+worker (single-node,
# "true") or as a pure worker in cluster topology ("false"), selected
# per-Pod by the deploying chart (deepdiver's ChartTrinoProvisioner sets it
# this way). Both properties must move together: a pure worker is neither
# "the coordinator" nor scheduled work as one.
coordinator=${ENV:TRINO_INCLUDE_COORDINATOR}
node-scheduler.include-coordinator=${ENV:TRINO_INCLUDE_COORDINATOR}
http-server.http.port=8080
# The coordinator's own address for a worker to register against, or
# localhost when this same container IS the coordinator (single-node).
discovery.uri=${ENV:TRINO_DISCOVERY_URI}
catalog.management=dynamic
catalog.store=baleia
