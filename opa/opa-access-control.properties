# Trino's OPA access control for Baleia's data policies (Baleia ADR 0028).
#
# List this file last in access-control.config-files, after the base rules and
# the Baleia catalog guard, for example:
#
#   access-control.config-files=etc/baleia-base-access-control.properties,etc/baleia-catalog-guard.properties,etc/opa-access-control.properties
#
# OPA runs next to the coordinator and listens on 127.0.0.1:8181 only; change
# the host and port when yours differ, and keep the paths.
#
# Set all five URIs. Trino treats an unset row-filters-uri as "no row filter"
# and an unset column-masking-uri as "no mask", so leaving one out silently
# turns that half of the policies off. The paths are the rules of the
# baleia.trino package shipped next to this file (opa/baleia-opa-policy.tar.gz).
access-control.name=opa
opa.policy.uri=http://127.0.0.1:8181/v1/data/baleia/trino/allow
opa.policy.batched-uri=http://127.0.0.1:8181/v1/data/baleia/trino/batch
opa.policy.row-filters-uri=http://127.0.0.1:8181/v1/data/baleia/trino/row_filters
opa.policy.column-masking-uri=http://127.0.0.1:8181/v1/data/baleia/trino/column_mask
opa.policy.batch-column-masking-uri=http://127.0.0.1:8181/v1/data/baleia/trino/batch_column_masks
